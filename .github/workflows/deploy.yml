name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GitHub Pages serves this repo under /<repo-name>/, so tell Astro the real
      # site + base (see astro.config.mjs) instead of rewriting hrefs after the
      # build — withBase()/localizePath() then prefix every internal link, asset,
      # canonical, hreflang and JSON-LD URL correctly.
      - run: npm run build
        env:
          ASTRO_SITE_URL: https://${{ github.repository_owner }}.github.io
          ASTRO_BASE_PATH: /${{ github.event.repository.name }}/
          # GitHub Pages has no serverless functions, so functions/api/lead.ts
          # does not run here. Point the contact form at a hosted copy of it via
          # a repo variable (Settings → Secrets and variables → Actions → Variables).
          PUBLIC_LEAD_ENDPOINT: ${{ vars.PUBLIC_LEAD_ENDPOINT }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true