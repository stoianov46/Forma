name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  site:
    name: Site (check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # This project has no lint/test script (package.json's "scripts" block
      # is dev/build/preview/astro/check) — `check` is Astro's own type
      # checker across .astro files. Add lint/test steps here if/when this
      # repo gains that tooling; don't invent commands that don't exist.
      - run: npm run check
      # Cloudflare Function types are checked separately (workers-types redeclares DOM globals).
      - run: npm run typecheck:functions
      - run: npm run build
      # Static QA over dist/: broken links, meta, JSON-LD validity.
      - run: npm run qa:static
      # SEO audit: technical FAILs exit non-zero; editorial WARNINGs are reported only (reports/seo-audit.md).
      - run: npm run seo:audit
      # Prices: single source (src/content/pricing.ts), identical in all locales, no Offer schema.
      - run: npm run pricing:check
      # Navigation decisions D1/D2 in all four locales, translation structure, and the contact form logic (mocked, sends nothing).
      - run: npm run nav:check
      - run: npm run i18n:check
      - run: npm run contact:check
      # Estimator, service finder, draft timeline, price-row details, /plan/ and /checklist/ content in 4 locales.
      - run: npm run plan:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-audit-report
          path: reports/seo-audit.*

  bots:
    name: Bots (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bots/package-lock.json
      - working-directory: bots
        run: npm ci
      - working-directory: bots
        run: npm run typecheck
